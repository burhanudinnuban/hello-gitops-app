name: Build Image

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: hello-gitops

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout App Repo
        uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITAPP_TOKEN }}

      - name: Generate Tag
        id: vars
        run: |
          echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/burhanudinnuban/hello-gitops:latest
            ghcr.io/burhanudinnuban/hello-gitops:${{ steps.vars.outputs.tag }}

      - name: Install Kustomize
        run: |
          curl -sSfL https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash
          sudo mv kustomize /usr/local/bin/

      - name: Update GitOps Repo
        run: |
          git clone https://${{ secrets.GITOPS_TOKEN }}@github.com/burhanudinnuban/hello-gitops-manifests.git

          cd hello-gitops-manifests/apps/hello

          kustomize edit set image \
          ghcr.io/burhanudinnuban/hello-gitops=ghcr.io/burhanudinnuban/hello-gitops:${{ steps.vars.outputs.tag }}

          cd ../..

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .
          git commit -m "Update image to ${{ steps.vars.outputs.tag }}"
          git push
